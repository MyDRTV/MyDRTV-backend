services:
  db:
    image: postgres:18
    container_name: mydrtv_postgres

    environment:
      POSTGRES_USER: mydrtv
      POSTGRES_PASSWORD: mydrtv_local_password
      POSTGRES_DB: mydrtv

    ports:
      - '127.0.0.1:5434:5432'

    volumes:
      - postgres18_data:/var/lib/postgresql

volumes:
  postgres18_data:
